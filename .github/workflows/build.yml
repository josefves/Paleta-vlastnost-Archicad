name: Sestaveni doplnku

on:
  push:
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-2022

    strategy:
      fail-fast: false
      matrix:
        acVersion: ['29', '30']

    steps:
      - name: Stazeni zdrojovych kodu
        uses: actions/checkout@v4

      - name: Instalace Pythonu
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Sestaveni pro Archicad ${{ matrix.acVersion }}
        run: |
          python Tools/BuildAddOn.py --configFile config.json --acVersion ${{ matrix.acVersion }} --buildConfig RelWithDebInfo

      - name: Ulozeni hotoveho doplnku
        uses: actions/upload-artifact@v4
        with:
          name: PaletaVlastnosti-AC${{ matrix.acVersion }}-Windows
          path: Build/**/PaletaVlastnosti.apx
          if-no-files-found: error
